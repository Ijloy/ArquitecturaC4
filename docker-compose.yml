# Infraestructura para desarrollo local.
# En la entrega, Redis es Cloud (Upstash): define REDIS_URL y no necesitas el servicio "redis".
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consultas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
