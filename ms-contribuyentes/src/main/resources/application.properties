spring.application.name=ms-contribuyentes
server.port=8081

# PostgreSQL - Registro de consultas
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/consultas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# API REST SRI - Catastro de contribuyentes
sri.catastro.base-url=https://srienlinea.sri.gob.ec/sri-catastro-sujeto-servicio-internet/rest/ConsolidadoContribuyente
