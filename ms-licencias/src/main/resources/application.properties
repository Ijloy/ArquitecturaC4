spring.application.name=ms-licencias
server.port=8083

# Redis Cache de consultas ANT (cache Cloud). Ejemplo Upstash:
#   REDIS_URL=rediss://default:<password>@<host>.upstash.io:6379
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=3s
# Copia "fresca": se devuelve sin consultar la ANT
licencias.cache.ttl-fresco-minutos=60
# Copia de respaldo: se usa cuando la ANT esta caida
licencias.cache.ttl-maximo-dias=30

# Portal Web ANT
ant.consulta.url=https://consultaweb.ant.gob.ec/PortalWEB/paginas/clientes/clp_grid_citaciones.jsp
ant.consulta.timeout-ms=8000

# Circuit Breaker: tras N fallos seguidos se deja de llamar a la ANT durante X segundos
ant.circuit-breaker.umbral-fallos=3
ant.circuit-breaker.segundos-abierto=60
